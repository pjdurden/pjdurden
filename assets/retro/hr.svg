<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#ff0000"/><stop offset="0.143" stop-color="#ff8a00"/>
      <stop offset="0.286" stop-color="#ffee00"/><stop offset="0.429" stop-color="#00cc44"/>
      <stop offset="0.571" stop-color="#00b3ff"/><stop offset="0.714" stop-color="#4b2fff"/>
      <stop offset="0.857" stop-color="#ff00d4"/><stop offset="1.000" stop-color="#ff0000"/>
    </linearGradient><clipPath id="c"><rect x="0" y="0" width="1000" height="8"/></clipPath></defs>
  <g clip-path="url(#c)"><g>
    <rect x="0" y="0" width="1000" height="8" fill="url(#rb)"/>
