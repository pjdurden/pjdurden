name: package downloads

# Keeps packages.json current so the README's headline badge stays live.
# Markdown cannot sum across packages, so the number is computed here and read
# back by shields' dynamic/json endpoint.
on:
  schedule:
    - cron: "17 6 * * *"   # daily, after PyPI's download dataset rolls over
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/package-downloads.mjs
      - name: commit if changed
        run: |
          # readme.md is included because the script may swap cmd-risk's PyPI cell
          # from the version badge to the downloads badge once stats exist.
          if git diff --quiet -- packages.json readme.md; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.json readme.md
          git commit -m "chore: refresh package download totals"
          git push
